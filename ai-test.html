<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mokoena Law AI Test</title>
<style>
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f7fa;color:#243b53;padding:30px 16px}
.container{max-width:760px;margin:0 auto}
.card{background:#fff;border:1px solid #d9e2ec;border-radius:14px;padding:28px;box-shadow:0 6px 20px rgba(16,42,67,.08)}
h1{margin:0 0 8px;color:#102a43;font-size:30px}
.intro{margin:0 0 24px;line-height:1.6}
label{display:block;font-weight:700;margin-bottom:8px}
textarea{width:100%;min-height:130px;resize:vertical;border:1px solid #d9e2ec;border-radius:10px;padding:14px;font:inherit;line-height:1.5;box-sizing:border-box}
button{margin-top:14px;border:0;border-radius:9px;padding:13px 22px;background:#102a43;color:#fff;font-weight:700;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.status{margin-top:18px;font-weight:700}
.answer{margin-top:14px;padding:18px;background:#f8fafc;border-left:4px solid #b08d57;border-radius:8px;white-space:pre-wrap;line-height:1.6;min-height:60px}
.note{margin-top:22px;font-size:13px;line-height:1.5;color:#52606d}
.back{display:inline-block;margin-bottom:18px;color:#102a43;text-decoration:none;font-weight:700}
</style>
</head>
<body>
<main class="container">
<a class="back" href="index.html">← Back to Mokoena Law</a>
<section class="card">
<h1>Mokoena Law AI Assistant — Test</h1>
<p class="intro">This temporary page tests the connection between the Mokoena Law website and the Cloudflare AI Worker.</p>
<label for="question">Ask a question</label>
<textarea id="question">What legal services does Lungelo Mokoena Attorneys offer?</textarea>
<button id="sendButton" type="button">Send to AI Assistant</button>
<div id="status" class="status" aria-live="polite"></div>
<div id="answer" class="answer" aria-live="polite"></div>
<p class="note">Test page only. Do not enter passwords, ID numbers, bank details, medical records, or other sensitive personal information.</p>
</section>
</main>
<script>
const WORKER_URL="https://mokoena-law-ai.crocolungs.workers.dev/chat";
const question=document.getElementById("question");
const sendButton=document.getElementById("sendButton");
const status=document.getElementById("status");
const answer=document.getElementById("answer");
sendButton.addEventListener("click",async()=>{
 const message=question.value.trim();
 if(!message){status.textContent="Please enter a question.";answer.textContent="";return;}
 sendButton.disabled=true;status.textContent="Connecting to the AI assistant...";answer.textContent="";
 try{
  const response=await fetch(WORKER_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:[{role:"user",content:message}]})});
  const data=await response.json();
  if(!response.ok||!data.ok) throw new Error(data.error||"The AI assistant returned an error.");
  status.textContent="AI response received.";
  answer.textContent=data.answer||"The AI returned an empty response.";
 }catch(error){
  status.textContent="Connection test failed.";
  answer.textContent=error.message||"The website could not connect to the AI assistant.";
 }finally{sendButton.disabled=false;}
});
</script>
</body>
</html>
